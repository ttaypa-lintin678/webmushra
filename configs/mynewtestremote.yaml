 - type: finish
   name: Thank you
   content: Thank you for answering! Please fill out the questionnaire so that we can get to know you better. If you still have time, you can help us some more by performing this test on a different instrument. Dont forget to send your results on this page, but first open this link in another tab. Dont forget to press the button below to submit your answers!!!
